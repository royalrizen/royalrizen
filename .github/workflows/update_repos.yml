name: Update Repository Card

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
  push:
    paths:
      - scripts/generate_repos.py
      - scripts/card-template.svg
      - .github/workflows/update.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate repository card
        env:
          REPO_LIMIT: ${{ vars.REPO_LIMIT }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python scripts/generate_repos.py

      - name: Commit updated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repos.svg
          git diff --cached --quiet || git commit -m "Update repository card"
          git push
