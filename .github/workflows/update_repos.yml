name: Update Repository Cards

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install cairosvg

      - name: Show repository structure
        run: |
          echo "Working directory:"
          pwd

          echo "Repository contents:"
          ls -la

          echo "Scripts directory:"
          ls -la scripts/

      - name: Generate repository cards
        env:
          REPO_LIMIT: ${{ vars.REPO_LIMIT }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python scripts/generate_repos.py

      - name: Verify generated file
        run: |
          echo "Searching for repo_card.svg..."

          if [ ! -f "./repo_card.svg" ]; then
            echo "ERROR: repo_card.svg does not exist in the repository root."
            echo "Searching for generated SVG files..."
            find . -type f -name "*.svg"
            exit 1
          fi

          echo "SUCCESS: repo_card.svg exists."
          ls -lh ./repo_card.svg

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ./repo_card.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update repository cards"
            git push
          fi
