name: Update YouTube Music Cache

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-music-cache
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update listening card version
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          readme = Path("README.md")
          content = readme.read_text(encoding="utf-8")

          pattern = (
              r'(https://royalrizen\.github\.io/YTMusic-Widget/'
              r'listening\.svg\?v=)\d+'
          )

          updated, count = re.subn(
              pattern,
              lambda match: match.group(1) + str(
                  int(match.group(0).rsplit("=", 1)[1]) + 1
              ),
              content,
              count=1,
          )

          if count == 0:
              raise SystemExit(
                  "Could not find the listening.svg URL with a numeric ?v= parameter."
              )

          readme.write_text(updated, encoding="utf-8")
          print("Updated listening card cache version.")

          PY

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Refresh YouTube Music card cache"
            git push
          fi
